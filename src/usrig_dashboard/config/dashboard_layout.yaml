# Collect-view layout: grid positions [row, col, rowspan, colspan]; remove a panel to hide it.
collect:
  bmode:     [0, 0, 2, 1]
  wrist:     [0, 1, 1, 1]
  episode:   [1, 1, 1, 1]
  force:     [2, 0, 1, 1]
  teleop:    [2, 1, 1, 1]
  health:    [3, 0, 1, 1]
  progress:  [3, 1, 1, 1]
  nodes:     [2, 2, 2, 1]
refresh_hz: 30
# Nodes shown in the Nodes panel (present / missing). The GUI only lists them; it never starts or
# stops recording or control nodes, so a GUI crash cannot interrupt capture.
expected_nodes: [micrus, robot_state, robot_control, d415, qc_monitor, episode_manager, keyboard_teleop]
recording_node: rosbag2_recorder
gui_nice: 10            # lower CPU priority for the GUI process (0 = unchanged)
force_window_s: 10
