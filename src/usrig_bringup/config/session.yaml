# Session configuration. Nothing here is hard-coded in launch files or nodes.
# Values marked "NOT VERIFIED" were not checked on the rig yet.

session:
  root: ~/data                                  # [SESSION_ROOT] real collection only
  sim_root: ~/data_sim                          # sim:=true runs (micrus --simulate / URSim); never exported
  presession_max_age_h: 12                      # real sessions need a passing presession_check younger than this
  id_pattern: "{date}_{phantom_id}_{operator_id}_s{n:02d}"
  operators: [op1, op2]                         # [OPERATORS]
  phantom_id: null                              # one of the keys under phantoms: below
  phantom_placement: null
  stage: 0                                      # 0 shakedown, 1 constant speed, 2 planned
  min_free_disk_gb: 50
  waypoint_dir: ~/data/waypoints              # waypoints/<phantom_id>.yaml
  path_dir: ~/data/paths                      # paths/<phantom_id>.yaml
  calibration_dir: ~/data/calibration         # raw captures of every calibration (images, poses)
  phantom_dir: ~/data/phantoms                # phantoms/<phantom_id>.yaml (fiducials)

# Open-H V2 proposal (IIT Mandi): two phantoms, 10 h total in 20-30 s episodes, ~20 % failure/recovery.
phantoms:
  vascular_4vein:
    name: 4-vein bifurcated vascular phantom
    target_hours: 6.0
  central_line_gen2:
    name: Gen II Central Line phantom (imaging only, no needle insertion)
    target_hours: 4.0
targets:
  total_hours: 10.0
  failure_recovery_fraction: 0.20
  episode_s: [20, 30]

micrus:
  command: micrus                               # [MICRUS_CMD]: `micrus` (SDK conda install) or AppImage path
  mode: serve                                   # serve (headless) | view
  out_root: ~/MicrUs                            # --out = <out_root>/<session_id>
  out_root_sim: ~/MicrUs_sim                    # used with sim:=true
  ros2_name: micrus
  ros2_frame: micrus_probe
  # Scan settings: fixed for a whole dataset (image size and frame rate depend on them).
  lines: 128
  depth_mm: 40
  pixel_mm: 0.1
  gain: null                                    # null = micrus default (not passed)
  power_db: null
  freq_mhz: null
  focus_mm: null
  dr: null
  tgc: null                                     # [a, b, c, d, e]
  view_area: null
  extra_args: []
  simulate_args: [--simulate, --sim-probe, "49", --sim-pid, "0x3447"]   # MPRO-L40S on MicrUs Pro rev.B
  expected_fps: [26.0, 29.0]                    # QC band; ~27.4 fps measured in simulation only
  shutdown_timeout_s: 15                        # SIGINT -> wait this long before SIGTERM
  licence_file: null                            # path of the installed .lic (per machine: micrus machine-id)
  usb_vendor_id: null                           # MicrUs USB vendor id from lsusb, e.g. "xxxx"

wrist_camera:
  enabled: true
  serial: "211422060364"                        # D415 read 13 Oct 2026, firmware 5.17.0.10
  camera_namespace: wrist
  camera_name: d415
  color_width: 640
  color_height: 480
  depth_width: 640
  depth_height: 480
  fps: 30
  # Locked manual colour exposure / white balance. Fill with `camera_autolock --write` on the
  # capture PC (samples what auto exposure / auto WB settle on, then locks those values).
  exposure_us: null
  white_balance_k: null
  # rs_launch.py arguments: names checked against realsense2_camera 4.58.4 (`--show-args`).
  rs_launch_args:
    serial_no: "'{serial}'"
    camera_namespace: "{camera_namespace}"
    camera_name: "{camera_name}"
    rgb_camera.color_profile: "{color_width},{color_height},{fps}"
    depth_module.depth_profile: "{depth_width},{depth_height},{fps}"
    align_depth.enable: "true"
    enable_sync: "true"
    enable_infra1: "false"
    enable_infra2: "false"
    pointcloud.enable: "false"
    rgb_camera.enable_auto_exposure: "false"
  # Not launch arguments in 4.58.4: passed to the node through rs_launch.py's config_file.
  # These are librealsense sensor options exposed as parameters; names NOT VERIFIED until the
  # node runs with a camera (`ros2 param list /wrist/d415`).
  rs_params:
    rgb_camera.exposure: "{exposure_us}"
    rgb_camera.enable_auto_white_balance: false
    rgb_camera.white_balance: "{white_balance_k}"
    rgb_camera.global_time_enabled: true
    depth_module.global_time_enabled: true
  # Topic names expected with namespace/name above; confirm with `ros2 topic list` (P1b).
  topics:
    color: /wrist/d415/color/image_raw
    color_info: /wrist/d415/color/camera_info
    depth: /wrist/d415/aligned_depth_to_color/image_raw
    depth_info: /wrist/d415/aligned_depth_to_color/camera_info
    metadata: /wrist/d415/color/metadata        # realsense2_camera_msgs/Metadata (4.58.4 publishes .../metadata); confirm on the capture PC
  calib_board:                                  # hand-eye calibration board (null until set)
    type: null                                  # checkerboard | charuco
    squares_x: null                             # squares along x (inner corners = squares - 1)
    squares_y: null
    square_mm: null
    marker_mm: null                             # charuco only
    dictionary: null                            # charuco only, e.g. DICT_5X5_100

recording:
  storage: mcap
  rt_priority: 70                               # chrt -f for ros2 bag record (needs the rtprio limit); 0 = off
  # rosbag2_storage_mcap writer options (zstd chunk compression, lossless). NOT VERIFIED on Humble.
  mcap_storage_config:
    compression: Zstd
    compressionLevel: Fast
    chunkSize: 4194304
  record_beamformed: null                       # open decision 4: include /micrus/beamformed?
  topics:
    - /micrus/bmode
    - /micrus/frame_info
    - /robot/state
    - /joint_states
    - /robot/tcp_pose
    - /robot/wrench
    - /robot/cmd_executed
    - /teleop/twist
    - /operator/command
    - /episode/events
    - /qc/status
    - /tf_static
  include_wrist_camera: true
  # The readiness gate waits until the bag has subscribed and these have produced a message.
  ready_topics: [/micrus/bmode, /robot/state, wrist.color, wrist.depth]
  ready_timeout_s: 20.0
  free_air_hold_s: 1.5                          # recorded before zero_ft / contact

freedrive:                                      # kinesthetic collection (docs/FREEDRIVE_COLLECTION_GUIDE.md)
  grip: wrist_handle                            # where the hand holds the arm: wrist_handle (above the F/T sensor:
                                                # force labels valid) | probe (hand force mixed into the F/T reading)

stage0:
  max_duration_s: 300
  approach_waypoint: null                       # optional waypoint name for automatic approach

stage1:
  speed_mm_s: null
  path_file: null                               # paths/<phantom_id>.yaml
  paths: []                                     # path names to run, in order

stage2:
  plan_file: null                               # plan_v1.csv
  scan_s: [20, 30]
  cap_s: 30
  success_hold_s: 2.0

gate01:
  min_consecutive_qc_pass: null
  key_speeds_chosen: null                       # set true when the operator has chosen them
  force_band_chosen: null

gate12:
  max_speed_error_pct: null
  min_paths: null
