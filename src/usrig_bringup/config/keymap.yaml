# Keyboard teleop. Tuning values only: speeds must stay inside rig.yaml limits
# (keyboard_teleop refuses to start otherwise). Probe frame: x along the array,
# y across it, z along the beam into tissue.

device: null            # /dev/input/by-id/...-event-kbd of the dedicated operator keyboard. Required for
                        # motion: null = any keyboard, and Ctrl+C / Ctrl+Z / Ctrl+S typed in a terminal
                        # would move the arm (keyboard_teleop refuses to publish twists with null)
allow_any_keyboard: false   # true only for a bench test with device: null and the arm out of reach
publish_rate_hz: 100
ramp_s: 0.25
fine_scale: 0.25
fine_keys: [LEFTSHIFT, RIGHTSHIFT]
enable_keys: [LEFTCTRL, RIGHTCTRL]   # D2 hold-to-move: motion keys act only while one is held
publish_twist: true                  # false when the SpaceMouse drives (keyboard = commands only)

speeds:
  slide_along_mm_s: null
  slide_across_mm_s: null
  rock_deg_s: null      # in-plane rotation (about probe y)
  tilt_deg_s: null      # out-of-plane rotation (about probe x)
  rotate_deg_s: null    # about the beam axis (probe z)
force_step_n: null

# D1: SpaceMouse (3Dconnexion) via the ROS spacenav driver (sudo apt install ros-humble-spacenav).
# Proportional probe-frame velocity while the enable button is held; same speeds as above (full
# deflection = the speed listed). Axis indices and signs depend on how the puck sits in front of the
# operator: check them in free air (NOT VERIFIED). Pushing / pulling the cap (force_axis) nudges the
# force setpoint, since the probe axis is force-regulated (compress / decompress).
spacemouse:
  topic: /spacenav/joy
  deadband: 0.08              # fraction of full deflection ignored (noise / unintended axes)
  enable_button: 0            # left button, held to move (D2)
  fine_button: 1              # right button, held for fine mode
  joy_timeout_s: 0.1          # no Joy for this long: stop publishing (deadman trips)
  axes:                       # probe-frame component: [joy axis index, sign]
    vx: [0, 1]                # slide along the array
    vy: [1, 1]                # slide across
    wx: [3, 1]                # tilt
    wy: [4, 1]                # rock
    wz: [5, 1]                # rotate
  force_axis: [2, -1]         # push down = compress
  force_rate_n_s: null        # setpoint change per second at full push (null until tuned)

# key: "axis:sign" (axis in vx vy vz wx wy wz)
motion:
  W: "vx:+1"            # slide along the array
  S: "vx:-1"
  A: "vy:+1"            # slide across the array
  D: "vy:-1"
  Q: "wy:+1"            # rock
  E: "wy:-1"
  R: "wx:+1"            # tilt
  F: "wx:-1"
  Z: "wz:+1"            # rotate
  C: "wz:-1"

commands:
  T: force_up
  G: force_down
  SPACE: view_reached
  "1": outcome_success
  "2": outcome_recovered
  "3": outcome_fail
  ESC: discard
  N: next
  P: hold
  K: ack_fault
  B: start_stop         # Stage 0: start / stop an episode
  O: onset              # view lost / failure starts (g_t = failure)
  U: recovery_start     # corrective motion starts (g_t = recovery)
  I: recovery_end       # view reacquired (g_t back to nominal)
  J: recontact          # after contact_lost: slow bounded descent back into contact
