# Open-H export environment: LeRobot 0.6.0 needs Python 3.12 (separate from the rig env).
#   conda env create -f environment_export.yml
name: openh-export
channels: [conda-forge]
dependencies:
  - python=3.12
  - pip
  - pip:
      - lerobot[dataset]==0.6.0   # the dataset extra holds the v2.1 -> v3.0 converter and LeRobotDataset
      - rosbags
      - pyarrow
      - pyyaml
      - numpy
